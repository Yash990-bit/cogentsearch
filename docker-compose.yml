version: '3.8'

services:
  # Redis Key-Value & Semantic Cache
  redis:
    image: redis:7-alpine
    container_name: cogentsearch-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # CogentSearch FastAPI REST & SSE Streaming Backend
  api:
    build: .
    container_name: cogentsearch-api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - OFFLINE_MODE=True
      - LLM_TEMPERATURE=0.0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./data:/app/data

  # CogentSearch Luxury Streamlit Frontend
  ui:
    build: .
    container_name: cogentsearch-ui
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - OFFLINE_MODE=True
      - API_BASE_URL=http://api:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - api
      - redis
    restart: unless-stopped
    volumes:
      - ./data:/app/data

volumes:
  redis_data:


